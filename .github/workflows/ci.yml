name: Proteomics Discovery Skill CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate-skill:
    name: End-to-End Validation Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python syntax compilation across all scripts
        run: |
          python -m py_compile scripts/*.py tests/*.py

      - name: Validate SKILL.md frontmatter and JSON resource schema
        run: |
          python - <<'EOF'
          import json, pathlib, re, yaml
          data = json.loads(pathlib.Path('resources/curated_proteomics_signatures.json').read_text(encoding='utf-8'))
          assert 'excel_date_gene_fixes' in data and len(data['excel_date_gene_fixes']) >= 30
          text = pathlib.Path('SKILL.md').read_text(encoding='utf-8')
          assert text.startswith('---\nname: proteomics-discovery-skill')
          fm = yaml.safe_load(text.split('---')[1])
          assert len(fm['description']) <= 1024, f"description too long: {len(fm['description'])}"
          print('Schema & frontmatter validation passed.')
          EOF

      - name: Portability scan (no hard-coded absolute user paths)
        run: |
          if grep -rnE "/Users/[A-Za-z]|/home/[a-z]+/|C:\\\\Users" \
               --include='*.py' --include='*.R' --include='*.md' --include='*.json' \
               --exclude-dir=.git . ; then
            echo "Hard-coded absolute path found"; exit 1; fi

      - name: Run end-to-end validation suite and unit tests
        run: |
          python tests/run_validation_suite.py
          for t in tests/test_*.py; do echo "== $t"; python "$t"; done
